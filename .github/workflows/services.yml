name: services

# Builds the operator image and publishes it to GHCR; Coolify pulls it from there.
on:
  push:
    branches: [main]
    paths:
      - services/operator/**
      - .github/workflows/services.yml
  workflow_dispatch:

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  operator-image:
    name: Operator image to GHCR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: services/operator
          push: true
          tags: |
            ghcr.io/blockchain-oracle/kakure-operator:${{ github.sha }}
            ghcr.io/blockchain-oracle/kakure-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
