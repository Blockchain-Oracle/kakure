<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
html{background:#141210}*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:#141210;color:#F4EEE3;font-family:Sora,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 55%,rgba(224,77,38,.28),transparent 65%)}
.phones{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:70px}
.phone{width:330px;height:714px;border-radius:52px;background:#000;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #2a2622;opacity:.92}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:43px;display:block}
.phone.side{transform:translateY(60px) scale(.92);opacity:.55}
.play{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:#E04D26;box-shadow:0 0 0 18px rgba(224,77,38,.25),0 20px 60px rgba(0,0,0,.5);display:grid;place-items:center}
.play svg{width:84px;height:84px;margin-left:12px}
.title{position:absolute;left:0;right:0;top:56px;text-align:center;font-weight:800;font-size:64px;letter-spacing:-2px}
.title em{font-style:normal;color:#E04D26}
.sub{position:absolute;left:0;right:0;bottom:54px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:26px;color:#cfc6b8;letter-spacing:1px}
</style></head><body>
<div class="glow"></div>
<div class="title">Deposit. Trade. <em>Nobody watching.</em></div>
<div class="phones"><div class="phone side"><img src="../../../apps/web/public/captures/markets.webp" alt="Markets"></div><div class="phone"><img src="../../../apps/web/public/captures/trade.webp" alt="The Kakure terminal on BTC"></div><div class="phone side"><img src="../../../apps/web/public/captures/positions.webp" alt="Open positions"></div></div>
<div class="play"><svg viewBox="0 0 24 24"><title>Play</title><path d="M6 4l14 8-14 8z" fill="#F4EEE3"/></svg></div>
<div class="sub">Watch the Kakure demo · Zcash testnet</div>
</body></html>
