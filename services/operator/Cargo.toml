[package]
name = "kakure-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Kakure operator: market wallet, whole-block scanning and payouts over Tor"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake2b_simd = "1"
bip0039 = { version = "0.14", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rusqlite = "0.37"
# The one TLS crypto provider already in the tree (via arti and tonic); installed explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.8"
serde_json = "1"
tokio = { version = "1.21", features = ["fs", "macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Zcash: the exact pre-release cohort zcash-devtool 0b3436b resolves (librustzcash NU7 pre.2).
orchard = { version = "0.16", default-features = false }
sapling = { package = "sapling-crypto", version = "0.9" }
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "tor", "unstable"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["orchard", "unstable"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "sapling", "unstable"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.1"
zip32 = "0.3"
zip321 = "=0.10.0-pre.2"
