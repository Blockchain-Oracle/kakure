[package]
name = "kakure-operator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Kakure operator: market wallet, whole-block scanning and payouts over Tor"

[dependencies]
anyhow = "1"
# The trading API's HTTP server (already in the tree via tonic); http1 only, behind Traefik.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
blake2b_simd = "1"
bhttp = "0.8"
bip0039 = { version = "0.14", features = ["std"] }
# Chaumian e-cash (Cashu BDHKE, NUT-00/01/02/07/12), used standalone: no cdk mint, no database.
cashu = "=0.18.2"
# Only to name the mint keyset's derivation path (already in the tree through cashu).
bitcoin = { version = "0.32", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
# Oblivious HTTP gateway (RFC 9458): pure-Rust HPKE, server side only.
ohttp = { version = "0.8", default-features = false, features = ["server", "rust-hpke"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
# Venue candles and the R2 uploader: plain HTTPS, rustls with the ring provider installed in main.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = "0.37"
# The one TLS crypto provider already in the tree (via arti and tonic); installed explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.21", features = ["fs", "macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Zcash: the exact pre-release cohort zcash-devtool 0b3436b resolves (librustzcash NU7 pre.2).
orchard = { version = "0.16", default-features = false }
sapling = { package = "sapling-crypto", version = "0.9" }
zcash_address = "=0.14.0-pre.2"
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "tor", "unstable"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["orchard", "unstable"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "sapling", "unstable"] }
zcash_primitives = { version = "=0.31.0-pre.2", features = ["non-standard-fees"] }
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.1"
zip32 = "0.3"
zip321 = "=0.10.0-pre.2"
